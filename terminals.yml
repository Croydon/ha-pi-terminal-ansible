- name: Configure the terminals
  hosts: terminals
  tasks:
  - name: Set hostname
    become: yes
    ansible.builtin.hostname:
      name: "{{ hostname }}"

  - name: Update via apt
    become: yes
    ansible.builtin.apt:
      update_cache: yes
      autoremove: yes
      upgrade: dist
    register: apt_result

  - name: Ensure locales package is installed
    become: yes
    ansible.builtin.apt:
      name: locales
      state: present
      update_cache: no

  - name: Enable de_DE UTF-8 locale
    become: yes
    ansible.builtin.lineinfile:
      path: /etc/locale.gen
      regexp: '^\s*#?\s*de_DE\.UTF-8\s+UTF-8\s*$'
      line: de_DE.UTF-8 UTF-8
      state: present

  - name: Check generated locales
    become: yes
    ansible.builtin.command: locale -a
    register: available_locales
    changed_when: false

  - name: Generate de_DE UTF-8 locale
    become: yes
    ansible.builtin.command: locale-gen de_DE.UTF-8
    register: locale_gen
    when: "'de_DE.utf8' not in available_locales.stdout_lines"

  - name: Set system default locale to German
    become: yes
    ansible.builtin.copy:
      dest: /etc/default/locale
      content: |
        LANG=de_DE.UTF-8
    register: locale_file

  - name: Apply updated locale
    become: yes
    ansible.builtin.command: update-locale LANG=de_DE.UTF-8
    register: update_locale
    when: locale_file.changed

  - name: Create labwc configuration directory
    become: yes
    ansible.builtin.file:
      path: /home/terminal/.config/labwc
      state: directory
      owner: terminal
      group: terminal
      mode: "0755"

  - name: Install Firefox labwc autostart entry
    become: yes
    ansible.builtin.copy:
      dest: /home/terminal/.config/labwc/autostart
      owner: terminal
      group: terminal
      mode: "0755"
      content: |
        #!/bin/sh
        /usr/bin/firefox --kiosk {{ kiosk_website }} >/dev/null 2>&1 &
    register: labwc_autostart

  - name: Find Firefox profiles
    become: yes
    ansible.builtin.find:
      paths: /home/terminal/.config/mozilla/firefox
      patterns: "*.default-release"
      file_type: directory
      recurse: no
    register: firefox_profiles

  - name: Require an existing Firefox profile
    ansible.builtin.assert:
      that:
        - firefox_profiles.matched | int > 0
      fail_msg: Firefox profile not found under /home/terminal/.config/mozilla/firefox

  - name: Install Firefox preferences
    become: yes
    ansible.builtin.copy:
      src: terminals/files/firefox/user.js
      dest: "{{ item.path }}/user.js"
      owner: terminal
      group: terminal
      mode: "0644"
    loop: "{{ firefox_profiles.files }}"
    register: firefox_user_js

  - name: Set Firefox as default browser via mimeapps.list
    become: yes
    ansible.builtin.copy:
      dest: /home/terminal/.config/mimeapps.list
      owner: terminal
      group: terminal
      mode: "0644"
      content: |
        [Default Applications]
        x-scheme-handler/http=firefox.desktop
        x-scheme-handler/https=firefox.desktop
        x-scheme-handler/about=firefox.desktop
        x-scheme-handler/unknown=firefox.desktop
        text/html=firefox.desktop
    register: mimeapps_file

  - name: Check system default browser alternative
    become: yes
    ansible.builtin.command: readlink -f /etc/alternatives/x-www-browser
    register: xwww_browser
    changed_when: false

  - name: Set Firefox as system default browser
    become: yes
    ansible.builtin.command: update-alternatives --set x-www-browser /usr/bin/firefox
    register: browser_alternative
    when: xwww_browser.stdout | trim != "/usr/bin/firefox"

  - name: Reboot 
    ansible.builtin.reboot:
      reboot_timeout: 3600
    when: >-
      apt_result.changed or
      labwc_autostart.changed or
      firefox_user_js.changed or
      mimeapps_file.changed or
      browser_alternative.changed
